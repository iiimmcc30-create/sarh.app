# Render Blueprint — Sarh API + Worker + Socket + Redis
# https://render.com/docs/blueprint-spec
#
# Database remains the existing Supabase PostgreSQL instance (set DATABASE_URL / DIRECT_URL).
# Redis is provisioned here. Worker and Socket share the same Docker image as the API
# but start different entry files and do not run migrations.

envVarGroups:
  - name: sarh-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: safat

services:
  - type: keyvalue
    name: sarh-redis
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: sarh-api
    runtime: docker
    region: singapore
    plan: starter
    rootDir: backend-nest
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - fromGroup: sarh-shared
      - key: REDIS_URL
        fromService:
          name: sarh-redis
          type: keyvalue
          property: connectionString
      - key: DIRECT_URL
        sync: false
      - key: BUTCHER_ORDER_UNPAID_EXPIRES_MINUTES
        value: "30"
      - key: NI_BASE_URL
        sync: false
      - key: NI_API_KEY
        sync: false
      - key: NI_OUTLET_ID
        value: 36a1f0d3-6a8f-4287-958f-f151ae17146d
      - key: NI_BASIC_AUTH
        sync: false
      - key: NI_CHAIN_ID
        sync: false
      - key: NI_REALM
        sync: false
      - key: NI_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: sarh-worker
    runtime: docker
    region: singapore
    plan: starter
    rootDir: backend-nest
    dockerfilePath: Dockerfile
    dockerCommand: node dist/queue/worker.main.js
    envVars:
      - fromGroup: sarh-shared
      - key: REDIS_URL
        fromService:
          name: sarh-redis
          type: keyvalue
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: sarh-socket
    runtime: docker
    region: singapore
    plan: starter
    rootDir: backend-nest
    dockerfilePath: Dockerfile
    dockerCommand: node dist/gateway/socket.main.js
    healthCheckPath: /health
    envVars:
      - fromGroup: sarh-shared
      - key: REDIS_URL
        fromService:
          name: sarh-redis
          type: keyvalue
          property: connectionString
      - key: RUN_UNPAID_ORDER_EXPIRY
        value: "false"
