name: Keep-alive

# Render free services sleep after idle traffic, which makes
# https://www.sarh.app return Cloudflare 522. Ping health every 10 minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API
        run: curl -fsS --retry 4 --retry-delay 8 --retry-all-errors --max-time 40 https://sarh-new4.onrender.com/api/health
      - name: Wake Socket
        run: curl -fsS --retry 4 --retry-delay 8 --retry-all-errors --max-time 40 https://sarh-socket.onrender.com/health
