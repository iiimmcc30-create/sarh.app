# Sarh production stack — Hostinger VPS
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Requires .env.production (never commit). See scripts/hostinger/env.production.example
# Compatible with backend-nest Dockerfile ENTRYPOINT (api|worker|socket roles).

name: sarh

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sarh}
    volumes:
      # PG 18+ images expect the volume at /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sarh_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cap memory so noeviction is meaningful for BullMQ/session keys on a small VPS.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - sarh_internal

  api:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: sarh-backend:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      SERVICE_MODE: api
      PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - sarh_internal
    entrypoint: ['./docker-entrypoint.sh']

  worker:
    image: sarh-backend:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      SERVICE_MODE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - sarh_internal
    entrypoint: ['node']
    command: ['dist/queue/worker.main.js']

  socket:
    image: sarh-backend:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      SERVICE_MODE: socket
      PORT: '3002'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sarh}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      SOCKET_PORT: '3002'
      SOCKET_HTTP_PORT: '3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - '127.0.0.1:3002:3002'
    networks:
      - sarh_internal
    entrypoint: ['node']
    command: ['dist/gateway/socket.main.js']

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - socket
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl-redirect.conf:/etc/nginx/includes/ssl-redirect.conf:ro
      # Host path shared with certbot (scripts/hostinger/06-setup-ssl.sh)
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - sarh_internal

networks:
  sarh_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
